<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rootline — Infrastructure Operations Workspace</title>
  <style>
    :root{color-scheme:dark;--bg:#090d18;--sidebar:#0e1422;--panel:#121a2b;--panel2:#172238;--line:#263552;--text:#edf3ff;--muted:#8795b3;--blue:#7d9cff;--green:#56d6a0;--yellow:#efc969;--red:#f17f8a;--purple:#b49cff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--sidebar);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px;font-weight:800;font-size:18px;letter-spacing:.02em}.brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#91abff,#5b6ce0);color:#09101e;font-weight:900}.workspace{margin:0 4px 18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#111a2b;color:var(--muted);font-size:12px}.workspace strong{display:block;color:var(--text);font-size:13px;margin-top:2px}.nav-label{margin:18px 10px 7px;color:#637391;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.nav{display:flex;flex-direction:column;gap:3px}.nav button{border:0;border-radius:8px;background:transparent;color:#aab7d1;text-align:left;padding:9px 11px;display:flex;align-items:center;gap:10px}.nav button:hover,.nav button.active{background:#1a2740;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--blue)}.icon{width:18px;color:#8191b4;text-align:center}.nav .active .icon{color:var(--blue)}.count{margin-left:auto;min-width:20px;padding:1px 6px;border-radius:999px;background:#26385c;color:#aebff1;text-align:center;font-size:11px}.sidebar-footer{margin-top:auto;padding:12px 10px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.main{min-width:0;flex:1}.topbar{height:68px;display:flex;align-items:center;gap:18px;padding:0 30px;border-bottom:1px solid var(--line);background:#0c1220}.crumb{color:var(--muted);font-size:13px}.crumb strong{color:var(--text)}.search{margin-left:auto;width:min(340px,30vw);display:flex;align-items:center;gap:8px;padding:8px 12px;background:#131d31;border:1px solid var(--line);border-radius:8px;color:var(--muted)}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}.top-action{border:1px solid var(--line);border-radius:8px;background:#192746;color:#dae4ff;padding:9px 13px}.avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#41538d;font-size:12px;font-weight:800}.content{padding:28px 32px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em}.page-head h1{margin:4px 0 5px;font-size:26px}.page-head p{margin:0;color:var(--muted)}.primary{border:0;border-radius:8px;background:var(--blue);color:#071021;padding:10px 15px;font-weight:800}.secondary{border:1px solid var(--line);border-radius:8px;background:#17233a;color:#d6e0f8;padding:10px 14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}.card-label{color:var(--muted);font-size:12px}.card-value{font-size:28px;font-weight:800;margin:6px 0}.trend{font-size:12px}.up{color:var(--green)}.down{color:var(--red)}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:15px}.panel-head a{color:var(--blue);font-size:12px;cursor:pointer}.panel-body{padding:16px 18px}.focus{display:grid;gap:10px}.focus-row,.activity-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #202c45}.focus-row:last-child,.activity-row:last-child{border-bottom:0}.priority{width:7px;height:32px;border-radius:5px;background:var(--yellow)}.priority.red{background:var(--red)}.priority.green{background:var(--green)}.row-main{min-width:0;flex:1}.row-main strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-main span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.tag{display:inline-flex;align-items:center;padding:3px 7px;border-radius:5px;background:#202d49;color:#aebfe9;font-size:11px}.tag.red{background:#3a202b;color:#ff9aa4}.tag.green{background:#17392f;color:#76dfb0}.tag.yellow{background:#3a321a;color:#f1d47c}.table-tools{display:flex;gap:8px;margin-bottom:14px}.filter{border:1px solid var(--line);background:#111a2b;color:var(--muted);border-radius:7px;padding:8px 10px}.table{width:100%;border-collapse:collapse}.table th{color:#71809d;text-transform:uppercase;letter-spacing:.08em;font-size:10px;text-align:left;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line)}.table td{padding:14px;border-bottom:1px solid #202c45;color:#b8c4dc}.table tr:hover td{background:#18233a}.table td strong{color:var(--text);font-weight:650}.modal{position:fixed;inset:0;display:none;place-items:center;background:#030611b8;z-index:10}.modal.open{display:grid}.modal-card{width:min(680px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 30px 90px #0008}.modal-card textarea{width:100%;min-height:120px;background:#0b1324;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:12px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.notice{padding:10px 12px;border-left:3px solid var(--yellow);background:#342c18;color:#eed789;border-radius:3px;font-size:12px;margin-top:13px}@media(max-width:1050px){.sidebar{width:210px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:680px){.sidebar{width:62px;padding:12px 8px}.brand span,.workspace,.nav-label,.nav button span,.count,.sidebar-footer{display:none}.brand{padding:4px 6px 24px}.nav button{justify-content:center}.topbar{padding:0 16px}.search{display:none}.content{padding:20px 15px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">R</div><span>Rootline</span></div>
    <div class="workspace">WORKSPACE<strong>Platform Operations⌄</strong></div>
    <div class="nav-label">Workspace</div>
    <nav class="nav" id="nav">
      <button class="active" data-view="dashboard"><span class="icon">⌂</span><span>Overview</span></button>
      <button data-view="inbox"><span class="icon">✦</span><span>Ops Inbox</span><b class="count">7</b></button>
      <button data-view="incidents"><span class="icon">!</span><span>Incidents</span><b class="count">2</b></button>
      <button data-view="tasks"><span class="icon">✓</span><span>Tasks</span><b class="count">12</b></button>
      <button data-view="changes"><span class="icon">↻</span><span>Changes</span></button>
      <button data-view="assets"><span class="icon">◇</span><span>Assets</span></button>
    </nav>
    <div class="nav-label">Knowledge & risk</div>
    <nav class="nav">
      <button data-view="runbooks"><span class="icon">▤</span><span>Runbooks</span></button>
      <button data-view="security"><span class="icon">◆</span><span>Security</span><b class="count">4</b></button>
      <button data-view="expiry"><span class="icon">◷</span><span>Expiry</span><b class="count">3</b></button>
      <button data-view="backups"><span class="icon">▣</span><span>Backups</span></button>
      <button data-view="reports"><span class="icon">▥</span><span>Reports</span></button>
    </nav>
    <div class="nav-label">System</div>
    <nav class="nav"><button data-view="integrations"><span class="icon">⌘</span><span>Integrations</span></button><button data-view="audit"><span class="icon">◌</span><span>Audit log</span></button></nav>
    <div class="sidebar-footer">Read-only planning mode<br><span>Rootline v0.1.0</span></div>
  </aside>
  <section class="main"><header class="topbar"><div class="crumb">Rootline / <strong id="crumb">Overview</strong></div><div class="search">⌕ <input placeholder="Search assets, incidents, docs…" /></div><button class="top-action" id="ask">Ask Rootline</button><div class="avatar">ZÇ</div></header><main class="content" id="content"></main></section>
</div>
<div class="modal" id="modal"><div class="modal-card"><div class="panel-head" style="padding:0 0 15px;border:0"><h2>Ask Rootline</h2><button class="secondary" id="close">Close</button></div><p style="color:var(--muted)">Describe an operational intent. Rootline will build a typed, read-only plan.</p><textarea id="intent" placeholder="Investigate the production API incident after the last deploy"></textarea><div class="modal-actions"><button class="primary" id="build">Build plan</button></div><div id="plan-result"></div></div></div>
<script>
const data={incidents:[['INC-1042','Production API elevated 5xx','api-prod','High','Investigating','12 min ago'],['INC-1041','PostgreSQL replication lag','payments-db','Medium','Monitoring','2 hr ago']],tasks:[['TASK-208','Renew wildcard production certificate','Platform','High','Due in 6 days'],['TASK-207','Verify PostgreSQL restore','Database','High','Overdue'],['TASK-206','Review SSH hardening findings','Security','Medium','Due tomorrow'],['TASK-205','Harbor retention cleanup','Platform','Low','Due in 9 days']],assets:[['api-prod','Kubernetes Deployment','Production','Healthy','ArgoCD'],['payments-db','CloudNativePG cluster','Production','Warning','Kubernetes'],['edge-01','Linux server','Production','Healthy','NetBird'],['harbor','Container registry','Shared','Healthy','Harbor']],security:[['SEC-142','SSH password authentication enabled','edge-01','High','Open'],['SEC-141','Privileged pod detected','payments-api','High','In progress'],['SEC-139','Missing default security headers','web-gateway','Medium','Open'],['SEC-136','Old Harbor image','harbor','Low','Accepted']],expiry:[['*.example.com','TLS certificate','Production','6 days','Critical'],['harbor-token','API token','Shared','21 days','Warning'],['backup-prod','Retention policy','Production','44 days','Healthy']]};
const titles={dashboard:'Overview',inbox:'Ops Inbox',incidents:'Incidents',tasks:'Tasks',changes:'Changes',assets:'Assets',runbooks:'Runbooks',security:'Security',expiry:'Expiry & renewals',backups:'Backups & recovery',reports:'Reports',integrations:'Integrations',audit:'Audit log'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const table=(headers,rows)=>`<table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<strong>${esc(c)}</strong>`:i===3?`<span class="tag ${String(c).toLowerCase().includes('high')||String(c).toLowerCase().includes('critical')?'red':String(c).toLowerCase().includes('warning')||String(c).toLowerCase().includes('medium')?'yellow':String(c).toLowerCase().includes('healthy')?'green':''}">${esc(c)}</span>`:esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function dashboard(){return `<div class="page-head"><div><div class="eyebrow">Tuesday, 21 October 2026</div><h1>Good morning, Zeynep</h1><p>Here is what needs your attention across the platform.</p></div><button class="primary" onclick="openModal()">+ New operation</button></div><div class="cards"><div class="card"><div class="card-label">Open incidents</div><div class="card-value">2</div><div class="trend down">↑ 1 since yesterday</div></div><div class="card"><div class="card-label">Pending actions</div><div class="card-value">7</div><div class="trend">3 require attention today</div></div><div class="card"><div class="card-label">Open security findings</div><div class="card-value">4</div><div class="trend up">↓ 2 this week</div></div><div class="card"><div class="card-label">Expiring soon</div><div class="card-value">3</div><div class="trend down">1 critical within 7 days</div></div></div><div class="grid"><div class="panel"><div class="panel-head"><h2>Today's focus</h2><a onclick="view('inbox')">View all</a></div><div class="panel-body"><div class="focus"><div class="focus-row"><i class="priority red"></i><div class="row-main"><strong>Production wildcard certificate expires in 6 days</strong><span>Certificate · api.example.com</span></div><span class="tag red">Critical</span></div><div class="focus-row"><i class="priority red"></i><div class="row-main"><strong>PostgreSQL restore test is overdue</strong><span>Backup · payments-db</span></div><span class="tag red">High</span></div><div class="focus-row"><i class="priority"></i><div class="row-main"><strong>Review SSH hardening findings</strong><span>Security · edge-01</span></div><span class="tag yellow">Due tomorrow</span></div><div class="focus-row"><i class="priority green"></i><div class="row-main"><strong>API incident investigation is waiting for verification</strong><span>Incident · INC-1042</span></div><span class="tag green">In progress</span></div></div></div></div><div class="panel"><div class="panel-head"><h2>Recent activity</h2><a onclick="view('audit')">Audit log</a></div><div class="panel-body"><div class="activity-row"><div class="avatar">ZÇ</div><div class="row-main"><strong>Incident plan generated</strong><span>INC-1042 · 12 minutes ago</span></div></div><div class="activity-row"><div class="avatar" style="background:#315c62">AR</div><div class="row-main"><strong>ArgoCD sync completed</strong><span>api-prod · 28 minutes ago</span></div></div><div class="activity-row"><div class="avatar" style="background:#5b426f">AI</div><div class="row-main"><strong>Weekly report drafted</strong><span>Rootline · 1 hour ago</span></div></div></div></div></div>`}
function listView(key){const rows=data[key]||[];const config={incidents:['ID','Title','Service','Priority','Status','Updated'],tasks:['ID','Task','Owner','Priority','Due'],assets:['Name','Type','Environment','Health','Source'],security:['ID','Finding','Asset','Severity','Status'],expiry:['Name','Type','Environment','Remaining','Status']}[key]||['Name','Type','Owner','Status'];return `<div class="page-head"><div><div class="eyebrow">Workspace</div><h1>${titles[key]}</h1><p>Manage and investigate operational records from one place.</p></div><button class="primary" onclick="openModal()">+ New record</button></div><div class="panel"><div class="panel-head"><h2>${rows.length} records</h2><div><button class="filter">All statuses⌄</button> <button class="filter">Filter</button></div></div><div class="panel-body" style="padding:0">${table(config,rows)}</div></div>`}
function generic(key){const items={inbox:['Certificate renewal needed','Backup restore verification overdue','Production API investigation','SSH hardening remediation'],changes:['api-prod deployment v1.8.2','DNS record update','Harbor retention policy'],runbooks:['Kubernetes rollback','TLS certificate renewal','PostgreSQL restore','Longhorn volume recovery'],backups:['payments-db daily backup','prod-object-storage','harbor-registry'],reports:['Weekly infrastructure report','INC-1042 postmortem draft','Security remediation report'],integrations:['Kubernetes / Rancher','ArgoCD','Gitea','Prometheus + Loki','Telegram'],audit:['Plan generated for INC-1042','Read capability executed','Incident status updated']}[key]||[];return `<div class="page-head"><div><div class="eyebrow">Workspace</div><h1>${titles[key]}</h1><p>Rootline keeps the operational context and next action together.</p></div><button class="primary" onclick="openModal()">+ Create</button></div><div class="panel"><div class="panel-head"><h2>${items.length} items</h2><button class="filter">Search</button></div><div class="panel-body"><div class="focus">${items.map((x,i)=>`<div class="focus-row"><i class="priority ${i===0?'red':i===1?'':'green'}"></i><div class="row-main"><strong>${x}</strong><span>${key==='runbooks'?'Runbook · versioned documentation':key==='integrations'?'Connector · configuration status':key==='audit'?'Audit event · today':'Operational record · needs review'}</span></div><span class="tag ${i===0?'red':''}">${i===0?'Needs attention':'Active'}</span></div>`).join('')}</div></div></div>`}
function view(key){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===key));document.querySelector('#crumb').textContent=titles[key]||'Overview';document.querySelector('#content').innerHTML=key==='dashboard'?dashboard():(data[key]?listView(key):generic(key))}
function openModal(){document.querySelector('#modal').classList.add('open');document.querySelector('#intent').focus()}function closeModal(){document.querySelector('#modal').classList.remove('open')}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>view(b.dataset.view)));document.querySelector('#ask').addEventListener('click',openModal);document.querySelector('#close').addEventListener('click',closeModal);document.querySelector('#build').addEventListener('click',async()=>{const input=document.querySelector('#intent'),out=document.querySelector('#plan-result');out.innerHTML='<div class="notice">Selecting typed capabilities…</div>';try{const r=await fetch('/api/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({intent:input.value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Planning failed');out.innerHTML=`<div class="notice">${esc(d.summary)}<br><br>${d.steps.map((s,i)=>`${i+1}. <strong>${esc(s.capability)}</strong> — ${esc(s.description)}`).join('<br>')}</div>`}catch(e){out.innerHTML=`<div class="notice">${esc(e.message)}</div>`}});view('dashboard');
</script>
</body>
</html>
