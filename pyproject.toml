[project]
name = "rootline"
version = "0.1.0"
description = "A privacy-first infrastructure operations agent"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
test = [
    "pytest>=8",
]

[project.scripts]
rootline = "rootline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
